  // ---------- rotas ----------
  var PUBLIC={"#/entrar":viewSignin,"#/criar-conta":viewSignup,"#/confirmar":viewConfirm,"#/esqueci":viewForgot};
  async function route(quiet){
    var x=location.hash||"#/",m,v=$("view");
    if(recovering){if(me)return viewNewPass();return viewForgot();}
    if(!me){
      stopChat();
      if(PUBLIC[x])return PUBLIC[x]();
      rememberNext();
      return (store("ib-has-account")||!why()?viewSignin:viewSignup)();
    }
    if(PUBLIC[x]){location.replace("#/");return;}
    if(!quiet)stopChat();
    try{
      if(/^#\/pedido\//.test(x)&&quiet)return;
      if((m=x.match(/^#\/pedido\/([\w-]+)/)))return await viewOrder(m[1]);
      if((m=x.match(/^#\/livre\/([\w-]+)/)))return await viewSourcing(m[1]);
      if((m=x.match(/^#\/novo\/([\w-]+)/)))return await viewNew(m[1]);
      if(/^#\/pedidos/.test(x))return viewOrders(new URLSearchParams(x.split("?")[1]||"").get("f")||"");
      if(x==="#/mensagens")return viewInbox();
      if(x==="#/sob-medida")return viewSourcingList();
      if(x==="#/pedido-livre")return viewSourcingNew();
      if(x==="#/lista")return await viewList();
      if(x==="#/dados")return viewData();
      if(x==="#/bem-vindo")return viewData(true);
      if(x==="#/conta")return viewAccount();
      // Primeira vez: completar a empresa antes do painel
      if(!buyer.city)return viewData(true);
      return viewHome();
    }catch(e){fail(e);}
  }
