<!DOCTYPE html>
<!--
  Orçamentos – área do administrador (/admin-orcamentos)
  O time India Brazil cria pedidos de orçamento (RFQs) para um fornecedor, acompanha as cotações
  e conversa no chat como comprador ou como equipe. Mesmo login do /admin (tabela public.admins).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orçamentos | India Brazil</title>
<link rel="icon" href="/assets/logo/india-brazil-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/js/rfq-chat.js"></script>
<style>

  --green:#2FB283; --error:#FF8A80; --focus:#7FA6FF; --mine:#173A31; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;font-size:15px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
a{color:var(--green)}

[hidden]{display:none!important}
header{background:var(--navy);color:#fff}

main{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:.55rem 1rem;border:1.5px solid transparent;cursor:pointer;background:var(--green);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}

input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(47,111,237,.18)}
label{display:block;font-weight:500;margin-bottom:.3rem}
.field{margin-bottom:1rem}
.hint{font-size:.85rem;color:var(--muted);margin:.3rem 0 0}
.muted{color:var(--muted)}
.err{color:var(--error);font-size:.9rem;margin:.6rem 0 0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar .grow{flex:1 1 240px;display:flex;gap:.6rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover{background:var(--chip)}
.scroll{overflow-x:auto}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.good{background:rgba(11,122,85,.12);color:var(--green)}
.pill.warn{background:rgba(255,145,0,.15);color:#B45F00}
.pill.bad{background:rgba(180,35,24,.12);color:var(--error)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.warn{color:var(--orange)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.form2 .full{grid-column:1/-1}
.form2 h3{grid-column:1/-1;margin-top:.4rem}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;align-items:flex-end;margin-bottom:16px}
.head h1{font-size:1.4rem;margin:0}
</style>
</head>
<body>
<header><div class="in">
  <a href="/admin"><img src="/assets/logo/india-brazil-logo-white.svg" alt="India Brazil"></a>
  <nav id="nav" hidden><a href="/admin">Cadastros</a><a href="/admin-orcamentos#/" id="nOrc">Orçamentos</a><a href="/admin-orcamentos#/livres" id="nLiv">Pedidos livres</a><a href="/admin-orcamentos#/funil" id="nFun">Funil</a><button class="btn btn-ghost btn-sm" id="logout" type="button">Sair</button></nav>
</div></header>

<main>
  <div class="card empty" id="gate" hidden><p>Entre primeiro na <a href="/admin">área do administrador</a>.</p></div>
  <section id="list" hidden></section>
  <section id="create" hidden></section>
  <section id="detail" hidden></section>
  <section id="extra" hidden></section>
  <p class="err" id="appErr" role="alert"></p>
</main>

<script>

      rows.forEach(function(x){

        tb.appendChild(h("tr",{class:"row",tabindex:"0",onclick:go,onkeydown:function(e){if(e.key==="Enter")go();}},[
          h("td",null,date(x.created_at)),h("td",{class:"mono"},x.code),h("td",null,h("b",null,x.product)),h("td",null,[s.company_name||"–",h("div",{class:"muted mono"},s.reference||"")]),
          h("td",null,x.buyer_label),h("td",null,x.quantity!=null?x.quantity+" "+(x.unit||""):"–"),h("td",null,String((x.rfq_quotes||[]).length)),h("td",null,pill(x.status))]));

      h("div",{class:"field full"},[h("label",{for:"fDetails"},"Detalhes"),h("textarea",{id:"fDetails",placeholder:"Specs, colours, sizes, packaging, certifications…"},src&&src.details||"")]),
      fld("Quantidade",h("input",{id:"fQty",type:"number",min:"0",step:"any",value:src&&src.quantity!=null?src.quantity:null})),fld("Unidade",h("input",{id:"fUnit",placeholder:"pcs, kg, m…",value:src?src.unit:null})),

      fld("Incoterm",sel("fInco",[""].concat(INCO),"FOB")),fld("Destino",h("input",{id:"fDest",placeholder:"Ex.: Santos, SP",value:src?src.destination:null})),
      fld("Precisa até",h("input",{id:"fNeed",type:"date",value:src?src.needed_by:null})),
      h("div",{class:"full"},[h("button",{class:"btn",type:"submit"},"Criar e enviar ao fornecedor"),h("a",{class:"btn btn-ghost",href:"#",style:"margin-left:.5rem"},"Cancelar"),h("p",{class:"err",role:"alert"})])
    ]);
    f.addEventListener("submit",async function(ev){
      ev.preventDefault();var v=function(id){return f.querySelector("#"+id).value.trim();},err=f.querySelector(".err");err.textContent="";

    // Sessões distintas que passaram por pelo menos um dos eventos

    var visits=Object.keys(r.data.reduce(function(a,e){a[e.session]=1;return a;},{})).length;
